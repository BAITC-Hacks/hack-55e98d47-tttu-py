[project]
name = "event-contractor-matching"
version = "1.0.0"
requires-python = ">=3.13"

[tool.black]
target-version = ["py313"]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

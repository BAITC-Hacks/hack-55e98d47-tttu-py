<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Подбор event-подрядчиков с понятным объяснением рекомендации">
    <title>{% block title %}Подбор подрядчиков{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
  </head>
  <body class="bg-body-tertiary">
    <a class="visually-hidden-focusable position-absolute top-0 start-0 p-3 bg-white" href="#main-content">К основному содержанию</a>
    <header class="border-bottom bg-white">
      <div class="container py-3">
        <a class="text-decoration-none text-body fw-semibold" href="{{ url_for('web.index') }}">Event Match</a>
      </div>
    </header>
    <main id="main-content" class="container py-4 py-lg-5">
      {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='js/form.js') }}" defer></script>
  </body>
</html>

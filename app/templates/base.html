<!doctype html>
<html lang="{{ locale }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ copy.meta_description }}">
    <title>{% block title %}{{ copy.page_title }}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
  </head>
  <body class="bg-body-tertiary">
    <a class="visually-hidden-focusable position-absolute top-0 start-0 p-3 bg-white" href="#main-content">{{ copy.skip_link }}</a>
    <header class="border-bottom bg-white">
      <div class="container py-3 d-flex flex-wrap align-items-center justify-content-between gap-3">
        <a class="text-decoration-none text-body fw-semibold" href="{{ url_for('web.index', locale=locale) }}">Event Match</a>
        <nav class="locale-switcher d-flex align-items-center gap-1" aria-label="{{ copy.locale_switcher }}">
          {% for option in locale_options %}
            {% if form is not none %}
              <form method="post" action="{{ url_for('web.index') }}" class="m-0">
                <input type="hidden" name="locale" value="{{ option.code }}">
                <input type="hidden" name="switch_locale" value="1">
                {% if result and result.view_id %}<input type="hidden" name="view_id" value="{{ result.view_id }}">{% endif %}
                {% for name, value in form.items() %}<input type="hidden" name="{{ name }}" value="{{ value }}">{% endfor %}
                <button class="btn btn-sm {% if option.active %}btn-primary{% else %}btn-outline-secondary{% endif %}"
                        type="submit" lang="{{ option.code }}"{% if option.active %} aria-current="page"{% endif %}>
                  {{ option.label }}
                </button>
              </form>
            {% else %}
              <a class="btn btn-sm {% if option.active %}btn-primary{% else %}btn-outline-secondary{% endif %}"
                 href="{{ url_for('web.index', locale=option.code) }}" lang="{{ option.code }}"{% if option.active %} aria-current="page"{% endif %}>
                {{ option.label }}
              </a>
            {% endif %}
          {% endfor %}
        </nav>
      </div>
    </header>
    <main id="main-content" class="container py-4 py-lg-5">
      {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='js/form.js') }}" defer></script>
  </body>
</html>

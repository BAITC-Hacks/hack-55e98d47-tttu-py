<!doctype html>
<html lang="{{ locale }}" data-bs-theme="light" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="description" content="{{ copy.meta_description }}">
    <title>{% block title %}{{ copy.page_title }}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/app.css', v='2') }}" rel="stylesheet">
  </head>
  <body>
    <a class="visually-hidden-focusable position-absolute top-0 start-0 p-3 bg-white" href="#main-content">{{ copy.skip_link }}</a>
    <header class="site-header">
      <div class="app-container header-inner">
        <a class="brand" href="{{ url_for('web.index', locale=locale) }}"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="m5 12 4 4L19 6M15 15l4 4M5 5l3 3" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Event<span class="brand-accent">Match</span></a>
        <nav class="locale-switcher" aria-label="{{ copy.locale_switcher }}">
          {% for option in locale_options %}
            {% if form is not none %}
              <form method="post" action="{{ url_for('web.index') }}" class="m-0" data-locale-form>
                <input type="hidden" name="locale" value="{{ option.code }}">
                <input type="hidden" name="switch_locale" value="1">
                {% if result and result.view_id %}<input type="hidden" name="view_id" value="{{ result.view_id }}">{% endif %}
                {% for name, value in form.items() %}<input type="hidden" name="{{ name }}" value="{{ value }}">{% endfor %}
                <button class="btn btn-sm {% if option.active %}btn-primary{% else %}btn-outline-secondary{% endif %}"
                        type="submit" lang="{{ option.code }}"{% if option.active %} aria-current="page"{% endif %}>
                  {{ option.label }}
                </button>
              </form>
            {% else %}
              <a class="btn btn-sm {% if option.active %}btn-primary{% else %}btn-outline-secondary{% endif %}"
                 href="{{ url_for('web.index', locale=option.code) }}" lang="{{ option.code }}"{% if option.active %} aria-current="page"{% endif %}>
                {{ option.label }}
              </a>
            {% endif %}
          {% endfor %}
        </nav>
      </div>
    </header>
    <main id="main-content" class="app-container main-content">
      {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='js/form.js', v='2') }}" defer></script>
  </body>
</html>
